name: macOS test build

on:
  workflow_dispatch:
  push:
    branches: [feat/client-name]

jobs:
  build-macos:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Build macOS app (release, ad-hoc signed)
        run: flutter build macos --release

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Plezy.app plezy-macos-release.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-macos-release
          path: build/macos/Build/Products/Release/plezy-macos-release.zip
