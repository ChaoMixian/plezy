name: Windows test build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8cde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Build Windows app (debug)
        run: flutter build windows --debug

      - name: Zip build output
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Debug"
          if (-not (Test-Path $src)) { $src = "build/windows/arm64/runner/Debug" }
          Compress-Archive -Path "$src/*" -DestinationPath plezy-windows-debug.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-windows-debug
          path: plezy-windows-debug.zip
