name: Windows test build

on:
  workflow_dispatch:
  push:
    branches: [feat/client-name]

jobs:
  build-windows:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Build Windows app (release)
        run: flutter build windows --release

      - name: Zip build output
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { $src = "build/windows/arm64/runner/Release" }
          Compress-Archive -Path "$src/*" -DestinationPath plezy-windows-release.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-windows-release
          path: plezy-windows-release.zip
